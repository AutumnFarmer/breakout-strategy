[project]
name = "a-breakout-screener"
version = "0.1.0"
description = "A-share weekly breakout stock screener with daily email reports."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "akshare>=1.17.0",
  "numpy>=1.26.0",
  "openpyxl>=3.1.0",
  "pandas>=2.2.0",
  "tushare>=1.4.0",
]

[project.scripts]
a-breakout = "a_breakout_screener.cli:main"
a-breakout-holdings-api = "a_breakout_screener.holdings_api:main"

[dependency-groups]
dev = [
  "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
