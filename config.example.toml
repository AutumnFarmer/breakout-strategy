[screener]
top_n = 20
max_workers = 6
history_cache_workers = 4
history_days = 1300
resistance_lookback_weeks = 156
resistance_exclude_recent_weeks = 4
min_history_rows = 520
pivot_k = 3
cluster_tolerance = 0.03
touch_tolerance = 0.02
min_touches = 3
min_touch_gap_weeks = 4
min_span_weeks = 20
breakout_buffer = 0.0
effective_breakout_pct = 0.02
max_buy_extension = 0.08
max_extension = 0.12
strong_volume_ratio = 1.8
min_amount = 100000000
min_price = 3.0
allowed_prefixes = ["00", "30", "60", "68"]
exclude_name_keywords = ["ST", "*ST", "退"]
# market_regime: "all" = 不检查大盘, "bull_only" = 仅在沪深300 > MA60 时选股
market_regime = "all"
market_index = "000300"
# confirmation_bars: 0 = 不确认, N = 要求突破后至少 N 个交易日收盘站稳阻力上方
confirmation_bars = 0
# ma_trend_period: 0 = 不检查长期趋势, 200 = 要求收盘价站上 MA200
ma_trend_period = 0
# max_open_gap_pct: 0 = 不过滤跳空, 0.02 = 开盘高于阻力 2% 以上则过滤
max_open_gap_pct = 0.0
# consolidation_*: 盘整质量扣分，默认关闭；例如 weeks=6, max_span=0.08, penalty_weight=8
consolidation_weeks = 0
consolidation_max_span = 0.0
consolidation_penalty_weight = 0.0

[paths]
cache_dir = "data/cache"
output_dir = "outputs"

[network]
# macOS system proxies can make AKShare/Eastmoney requests fail when the local proxy is down.
disable_system_proxy = true

[email]
enabled = false
# smtp: use SMTP credentials; mail: use local /usr/bin/mail; codex_gmail: use server Codex Gmail plugin.
method = "smtp"
smtp_host = ""
smtp_port = 465
smtp_user = ""
smtp_password = ""
smtp_ssl = true
smtp_starttls = false
mail_from = ""
mail_to = []
subject_prefix = "A股突破选股"

[ai_analysis]
enabled = false
# Uses the local Sub2API gateway by default. Set A_BREAKOUT_AI_API_KEY or SUB2API_API_KEY in env.
provider = "sub2api"
base_url = "http://127.0.0.1:8080"
model = "gpt-5.5"
timeout = 240
max_candidates = 20
allow_local_key_discovery = true
